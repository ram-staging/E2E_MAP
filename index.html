<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>India Locations Map</title>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, sans-serif;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    #status {
      position: absolute;
      top: 12px;
      left: 12px;
      z-index: 10;
      background: white;
      padding: 8px 12px;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,.25);
      font-size: 13px;
      display: none;
    }
  </style>
</head>

<body>
  <div id="status"></div>
  <div id="map"></div>

  <script>
    const GOOGLE_MAPS_API_KEY = "YOUR_DEMO_KEY";
 

    let map;
    let geocoder;
    let infoWindow;

    async function initMap() {
      const { Map } = await google.maps.importLibrary("maps");
      const { AdvancedMarkerElement } =
        await google.maps.importLibrary("marker");

      map = new Map(document.getElementById("map"), {
        center: {
          lat: 21.0,
          lng: 78.0
        },

        zoom: 5,

        mapId: "DEMO_MAP_ID",

        streetViewControl: false,
        fullscreenControl: true,
        mapTypeControl: false
      });

      geocoder = new google.maps.Geocoder();
      infoWindow = new google.maps.InfoWindow();

      await loadLocations(AdvancedMarkerElement);
    }

async function loadLocations(AdvancedMarkerElement) {

    const status = document.getElementById("status");

    try {

        const response = await fetch(
            "https://script.google.com/macros/s/AKfycbx0mYEDKk0SlJIIDfltW5Gl1Eyz8mVhpW05pDKeaVM8sgqdLm5Lh35dFAdkduiLAx_Z/exec"
        );

        if (!response.ok) {
            throw new Error("Unable to load locations");
        }

        const locations = await response.json();

        for (const location of locations) {
            await addLocationMarker(
                location,
                AdvancedMarkerElement
            );
        }

        status.style.display = "none";

    } catch (error) {

        console.error(error);

        status.textContent =
            "Unable to load locations.";

        status.style.display = "block";
    }
}

async function addLocationMarker(location, AdvancedMarkerElement) {

    const marker = new AdvancedMarkerElement({
        map: map,
        position: {
            lat: location.latitude,
            lng: location.longitude
        },
        title: location.name
    });

    marker.addListener("click", () => {

        infoWindow.setContent(`
            <div style="min-width:200px;padding:4px">
                <div style="font-size:16px;font-weight:bold;margin-bottom:8px">
                    ${escapeHtml(location.name)}
                </div>

                <div style="margin-bottom:5px">
                    <strong>Address:</strong><br>
                    ${escapeHtml(location.address)}
                </div>

                <div>
                    <strong>Category:</strong>
                    ${escapeHtml(location.category)}
                </div>
            </div>
        `);

        infoWindow.open({
            map: map,
            anchor: marker
        });
    });
}

    function parseCSV(csv) {
      const rows = [];
      let row = [];
      let value = "";
      let insideQuotes = false;

      for (let i = 0; i < csv.length; i++) {
        const char = csv[i];
        const next = csv[i + 1];

        if (char === '"' && insideQuotes && next === '"') {
          value += '"';
          i++;
        } else if (char === '"') {
          insideQuotes = !insideQuotes;
        } else if (char === "," && !insideQuotes) {
          row.push(value.trim());
          value = "";
        } else if ((char === "\n" || char === "\r") && !insideQuotes) {
          if (char === "\r" && next === "\n") {
            i++;
          }

          row.push(value.trim());
          value = "";

          if (row.some(cell => cell !== "")) {
            rows.push(row);
          }

          row = [];
        } else {
          value += char;
        }
      }

      if (value !== "" || row.length > 0) {
        row.push(value.trim());

        if (row.some(cell => cell !== "")) {
          rows.push(row);
        }
      }

      if (rows.length < 2) {
        return [];
      }

      const headers = rows[0].map(h =>
        h.toLowerCase().trim()
      );

      return rows.slice(1).map(row => ({
        name: row[headers.indexOf("name")] || "",
        address: row[headers.indexOf("address")] || "",
        category: row[headers.indexOf("category")] || ""
      })).filter(location =>
        location.name && location.address
      );
    }

    function escapeHtml(value) {
      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");
    }
	

	
  </script>

  <script
    async
    src="https://maps.googleapis.com/maps/api/js?key=AIzaSyANiIIj9HL9cOp633qbnDq86TQFKCZUdVQ&loading=async&callback=initMap">
  </script>

</body>
</html>
